# Beacon accelerometer homing: example configuration
#
# Experimental and vibe-coded. Working on three printers so far.
#
# This is an endstop type, like a physical switch or a probe. It homes with
# one touch. Select it in the X and Y stepper sections and add the section
# below. Nothing in it is required.

[beacon_accel_homing]
#    Homes X and Y by detecting the bump at the toolhead with the Beacon's
#    accelerometer. Needs beacon_klipper and a Beacon RevH. Leave the
#    options below commented out unless you have a reason to change them.
#beacon: beacon
#    Name of the Beacon section whose accelerometer is used.
#x_threshold: 8.0
#y_threshold: 8.0
#    How hard the toolhead has to hit the X (or Y) stop before homing
#    triggers, in g, measured on the homing axis only. Each must sit above
#    that axis's movement noise and below its weakest impact. Higher g
#    needs a stronger hit: less likely to trigger on vibration, but a soft
#    hit can be missed and homing then stops with an error at the travel
#    limit. Lower g reacts to softer hits, but vibration can trigger it
#    early.
#    BEACON_ACCEL_HOMING_STATUS reports both for the last homes.
#threshold: 8.0
#    Sets x_threshold and y_threshold at once. x_threshold and y_threshold
#    override it.
#x_impact_sign: 0
#y_impact_sign: 0
#    Direction of the hit on the accelerometer. 0 counts a hit in either
#    direction until the toolhead travels, then only a hit against the
#    travel. 1 or -1 counts only that direction from the start. Leave it at
#    0. A wrong sign makes homing trigger late or not at all.
#homing_accel: 5000
#    Acceleration limit in mm/s^2 while X or Y homes with this endstop. It
#    keeps the jolt at the start of the move far below the threshold, the
#    same way on Klipper and Kalico. The printer's own acceleration is put
#    back after homing, also when homing fails. It is never raised. Set 0 to
#    leave the acceleration alone.
#back_off_dist: 5
#    Before X or Y homes, the other axis is moved this many mm off its stop
#    if this module homed it and it is still pushed against the stop (for
#    example X before Y in G28). A pushed axis loads the belts and the
#    gantry, which can make the next home trigger falsely. Set 0 to switch
#    it off.
#baseline_time: 0.1
#    Seconds of standstill added before each homing pass. The resting
#    reading in that window is what the hit is compared against.
#stream_timeout: 0.05
#    If no accelerometer data arrives for this many seconds during homing,
#    the move is stopped and homing fails instead of homing blind.
#travel_margin: 1.1
#    Safety stop: homing fails if no hit arrives within the time it takes
#    to travel this multiple of the axis length at homing speed.
#watchdog_margin: 0.15
#    Extra seconds added to the expected homing move time before the safety
#    stop is triggered.

#####################################################################
#   STEPPER SECTIONS: change these in your existing [stepper_x] and
#   [stepper_y]. Comment out the old lines instead of deleting them, so
#   you can switch back.
#####################################################################
# [stepper_x]
# #endstop_pin: <your old X endstop pin>
# endstop_pin: beacon_accel:x
#    Replaces your current X endstop (a switch pin or the driver's
#    virtual_endstop for sensorless). Use beacon_accel:y in [stepper_y].
# homing_speed: 150
#    Speed of the homing move, mm/s. The hit has to be hard enough to stand
#    out from the movement noise. Below about 50 mm/s the hit can be too
#    soft to detect, and this module warns about it at startup.
# homing_retract_dist: 0
#    One touch per home, no back-off. A home that starts with the toolhead
#    already pressed against the stop is detected as such and needs no
#    second touch either. A second touch still works if you set a retract,
#    then keep second_homing_speed equal to homing_speed, because a slow
#    touch is too soft to detect.
#
# Lines that belong to sensorless homing. Comment them out:
#   diag0_pin / diag1_pin in the [tmc...] sections of the X and Y drivers.
#   home_current in the [tmc...] sections (Kalico). Motors home on their
#   normal run current with this endstop.
#   homing_accel and min_home_dist in the stepper sections (Kalico). This
#   module limits the acceleration itself and handles a start at the stop.
#   Left in, min_home_dist adds a second touch after starts close to the
#   stop, and homing_accel replaces this module's limit during the move.
#   driver_SGT / driver_SGTHRS stall thresholds can stay, they are unused.
#   A homing_override or homing macro that changes currents, waits for the
#   driver stall flag to clear or moves away before homing for sensorless
#   homing: remove those parts.
